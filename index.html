<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>index – Trading Übungsplatz</title>
<style>
:root{--bg:#0a0e13;--p:#10161e;--p2:#151d27;--ln:#1e2833;--tx:#e8edf3;--m:#78879a;--up:#22b07d;--dn:#e5534b;--g:#d4a73a}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#2a3647 transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 Inter,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
select,input,button{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 9px;font:inherit;transition:border-color .15s,background .15s}
input,select{width:100%}input:hover,select:hover{border-color:#2c3a4a}
button{cursor:pointer;width:auto}button:hover{border-color:var(--m)}
button.on{background:var(--g);color:#0a0e13;border-color:var(--g);font-weight:600}
:focus-visible{outline:2px solid var(--g);outline-offset:1px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--p)}
h1{font:700 18px Georgia,serif;margin:0;display:flex;align-items:center;gap:9px}
h1 i{width:13px;height:13px;background:linear-gradient(135deg,var(--g),#7d5f16);border-radius:3px;transform:rotate(45deg)}
h1 small{font:400 11px Inter,"Segoe UI",sans-serif;color:var(--m)}
.dot{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--m)}
.dot i{width:7px;height:7px;border-radius:50%;background:var(--dn)}.dot.ok i{background:var(--up);box-shadow:0 0 6px var(--up)}
.hs{display:flex;gap:20px;flex-wrap:wrap;margin-right:auto;margin-left:10px}.hs div{font-size:12.5px}.hs span{display:block;color:var(--m);font-size:10.5px}
header select{width:auto}
main{display:grid;grid-template-columns:230px 1fr 320px;grid-template-areas:"i c r" "b b b";gap:10px;padding:10px}
@media(max-width:1000px){main{grid-template-columns:1fr;grid-template-areas:"c" "r" "i" "b"}}
.bx{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:10px;min-width:0}
.ti{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ti b{font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.bar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;align-items:center}.bar button{padding:4px 9px}
#cv{width:100%;height:420px;display:block;cursor:crosshair}
.mut{color:var(--m)}.up{color:var(--up)}.dn{color:var(--dn)}
.r{display:flex;justify-content:space-between;gap:6px;padding:2px 0}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:5px 8px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--m);font-weight:500;position:sticky;top:0;background:var(--p)}th:first-child,td:first-child{text-align:left}
tr:hover td{background:#141c26}
.sc{overflow:auto;max-height:230px}
#ins{max-height:480px;overflow:auto;margin-top:8px}
.ir{display:flex;justify-content:space-between;padding:6px 8px;cursor:pointer;border-radius:6px;border-left:2px solid transparent}
.ir:hover{background:#151d27}.ir.on{background:#1b2634;border-left-color:var(--g)}
.gh{color:var(--m);font-size:11px;padding:8px 8px 2px}
.bk{display:flex;justify-content:space-between;padding:1px 6px;font-size:12px;cursor:pointer}
.sd{display:flex;gap:6px}.sd button{flex:1}
.buy{background:var(--up);border-color:var(--up);color:#fff;font-weight:600}.sell{background:var(--dn);border-color:var(--dn);color:#fff;font-weight:600}
.f{margin:5px 0}.f label{color:var(--m);font-size:11px;display:block;margin-bottom:2px}
.x{padding:1px 7px;font-size:11px}
.rm{color:var(--m);margin-left:4px;cursor:pointer}.rm:hover{color:var(--dn)}
</style>
</head>
<body>
<header>
  <h1><i></i>index<small>Trading Übungsplatz</small></h1><span id="live" class="dot"><i></i>Offline</span>
  <div class="hs" id="hs"></div>
  <select id="acc" aria-label="Konto"></select>
  <button id="new">Neues Konto</button><button id="reset">Zurücksetzen</button><button id="del">Löschen</button>
</header>
<main>
  <section class="bx" style="grid-area:i">
    <input id="q" placeholder="Märkte suchen: Silber, EUR, Pepe …   ( / )" aria-label="Suche">
    <div id="ins"></div>
  </section>
  <section class="bx" style="grid-area:c">
    <div class="bar" id="bar"></div>
    <canvas id="cv"></canvas>
    <div class="mut" id="st">Lade Kurse …</div>
  </section>
  <aside style="grid-area:r;display:flex;flex-direction:column;gap:10px">
    <div class="bx">
      <div class="sd" id="sd"><button data-s="buy">Kaufen</button><button data-s="sell">Verkaufen</button></div>
      <div class="f"><label>Ordertyp</label><select id="ot"><option value="market">Markt</option><option value="limit">Limit</option><option value="stop">Stop</option></select></div>
      <div class="f"><label id="pl">Preis (USDT)</label><input id="pxin" type="number" step="any"></div>
      <div class="f" style="display:flex;gap:6px"><div><label>Menge</label><input id="qty" type="number" step="any"></div><div><label>Gesamt (USDT)</label><input id="tot" type="number" step="any"></div></div>
      <div class="bar" id="pc"><button data-p=".25">25 %</button><button data-p=".5">50 %</button><button data-p=".75">75 %</button><button data-p="1">100 %</button></div>
      <div class="f" id="tps" style="display:flex;gap:6px"><div><label>Take Profit</label><input id="tp" type="number" step="any"></div><div><label>Stop Loss</label><input id="sl" type="number" step="any"></div></div>
      <div class="r mut"><span>Verfügbar</span><span id="av"></span></div>
      <div class="r mut"><span>Gebühr (0,1 %)</span><span id="fee"></span></div>
      <button id="go" style="width:100%;margin-top:6px"></button>
      <div id="msg" class="mut" style="min-height:18px;margin-top:4px"></div>
    </div>
    <div class="bx" id="dip">
      <div class="ti"><b>Buy the Dip</b><button id="dtog">Aus</button></div>
      <div class="g2">
        <div class="f"><label>Markt</label><select id="dsym"></select></div>
        <div class="f"><label>Referenz</label><select id="dref"><option value="cur">Kurs bei Start</option><option value="h24">24h-Hoch</option></select></div>
        <div class="f"><label>Kauf bei Rückgang (%)</label><input id="ddrop" type="number" step="any"></div>
        <div class="f"><label>Betrag pro Kauf (USDT)</label><input id="damt" type="number" step="any"></div>
        <div class="f"><label>Take Profit (%)</label><input id="dtp" type="number" step="any"></div>
        <div class="f"><label>Stop Loss (%)</label><input id="dsl" type="number" step="any"></div>
        <div class="f"><label>Max. Käufe</label><input id="dmax" type="number"></div>
        <div class="f"><label>Pause (Min.)</label><input id="dcd" type="number" step="any"></div>
      </div>
      <div id="dstat" style="margin-top:4px"></div>
    </div>
    <div class="bx"><div class="ti"><b>Orderbuch</b></div><div id="book" style="margin-top:4px"></div></div>
  </aside>
  <section class="bx" style="grid-area:b">
    <div class="bar" id="tabs"></div>
    <div class="sc" id="bot"></div>
  </section>
</main>
<script>
const FEE=.001;
const FUT=new Set(["XAUUSDT","XAGUSDT","XPTUSDT","XPDUSDT"]),USD=/^[A-Z0-9]{2,10}USDT$/;
const SP="https://api.binance.com/api/v3/",FP="https://fapi.binance.com/fapi/v1/",B=s=>FUT.has(s)?FP:SP;
const AL={XAUUSDT:"gold",XAGUSDT:"silver",XPTUSDT:"platin platinum",XPDUSDT:"palladium",PAXGUSDT:"gold",XAUTUSDT:"gold",EURUSDT:"euro",GBPUSDT:"pfund pound",AUDUSDT:"australischer dollar",TRYUSDT:"lira",BRLUSDT:"real"};
let UNI=[];
let LIST=[["XAUUSDT","Gold (XAU)","Edelmetalle"],["XAGUSDT","Silber (XAG)","Edelmetalle"],["XPTUSDT","Platin (XPT)","Edelmetalle"],["XPDUSDT","Palladium (XPD)","Edelmetalle"],["PAXGUSDT","Gold (PAXG)","Edelmetalle"],["XAUTUSDT","Gold (XAUT)","Edelmetalle"],
["BTCUSDT","Bitcoin","Krypto"],["ETHUSDT","Ethereum","Krypto"],["BNBUSDT","BNB","Krypto"],["SOLUSDT","Solana","Krypto"],["XRPUSDT","XRP","Krypto"],["ADAUSDT","Cardano","Krypto"],["DOGEUSDT","Dogecoin","Krypto"],["AVAXUSDT","Avalanche","Krypto"],["LINKUSDT","Chainlink","Krypto"],["LTCUSDT","Litecoin","Krypto"],["DOTUSDT","Polkadot","Krypto"],["TRXUSDT","Tron","Krypto"],["SHIBUSDT","Shiba Inu","Krypto"],["TONUSDT","Toncoin","Krypto"],["NEARUSDT","NEAR","Krypto"],["ATOMUSDT","Cosmos","Krypto"],["UNIUSDT","Uniswap","Krypto"],["BCHUSDT","Bitcoin Cash","Krypto"],["XLMUSDT","Stellar","Krypto"],["SUIUSDT","Sui","Krypto"],["PEPEUSDT","Pepe","Krypto"],["AAVEUSDT","Aave","Krypto"],["ETCUSDT","Ethereum Classic","Krypto"],["FILUSDT","Filecoin","Krypto"],["APTUSDT","Aptos","Krypto"],["ARBUSDT","Arbitrum","Krypto"],["OPUSDT","Optimism","Krypto"],["INJUSDT","Injective","Krypto"],["RUNEUSDT","THORChain","Krypto"],["ICPUSDT","Internet Computer","Krypto"],["HBARUSDT","Hedera","Krypto"],["VETUSDT","VeChain","Krypto"],["ALGOUSDT","Algorand","Krypto"],["POLUSDT","Polygon","Krypto"],["SEIUSDT","Sei","Krypto"],["TIAUSDT","Celestia","Krypto"],["IMXUSDT","Immutable","Krypto"],["GRTUSDT","The Graph","Krypto"],["MKRUSDT","Maker","Krypto"],["LDOUSDT","Lido DAO","Krypto"],["SANDUSDT","The Sandbox","Krypto"],["MANAUSDT","Decentraland","Krypto"],["AXSUSDT","Axie Infinity","Krypto"],["THETAUSDT","Theta","Krypto"],["EOSUSDT","EOS","Krypto"],["ENAUSDT","Ethena","Krypto"],["WLDUSDT","Worldcoin","Krypto"],["JUPUSDT","Jupiter","Krypto"],["ONDOUSDT","Ondo","Krypto"],["FETUSDT","Fetch.ai","Krypto"],["RENDERUSDT","Render","Krypto"],["TAOUSDT","Bittensor","Krypto"],["TRUMPUSDT","Official Trump","Krypto"],["WIFUSDT","dogwifhat","Krypto"],["BONKUSDT","Bonk","Krypto"],["FLOKIUSDT","Floki","Krypto"],["CRVUSDT","Curve","Krypto"],["SNXUSDT","Synthetix","Krypto"],["COMPUSDT","Compound","Krypto"],["1INCHUSDT","1inch","Krypto"],["EGLDUSDT","MultiversX","Krypto"],["FLOWUSDT","Flow","Krypto"],["CHZUSDT","Chiliz","Krypto"],["GALAUSDT","Gala","Krypto"],["APEUSDT","ApeCoin","Krypto"],["DYDXUSDT","dYdX","Krypto"],["PENDLEUSDT","Pendle","Krypto"],["STXUSDT","Stacks","Krypto"],["ENSUSDT","ENS","Krypto"],["NEOUSDT","NEO","Krypto"],["QNTUSDT","Quant","Krypto"],["PYTHUSDT","Pyth","Krypto"],["ZECUSDT","Zcash","Krypto"],["DASHUSDT","Dash","Krypto"],["XTZUSDT","Tezos","Krypto"],["KAVAUSDT","Kava","Krypto"],["EURUSDT","EUR / USD","Währungen"]];
const NAME={};LIST.forEach(x=>NAME[x[0]]=x[1]);
const TFS={"1s":1e3,"1m":6e4,"5m":3e5,"15m":9e5,"30m":18e5,"1h":36e5,"4h":144e5,"1d":864e5,"1w":6048e5};
const TABS={bal:"Guthaben",pos:"Positionen",ord:"Offene Orders",his:"Historie",mt:"Markttrades",stat:"Statistik"};
const etf=()=>FUT.has(S.sym)&&S.tf==="1s"?"1m":S.tf;
const KEY="idx_trainer_v1",uid=()=>Math.random().toString(36).slice(2,9);
const DIPD=()=>({on:false,sym:"PAXGUSDT",ref:"cur",drop:3,amt:100,tp:5,sl:0,max:5,cd:5,peak:0,buys:0,last:0,note:""});
const mk=(name,start)=>({id:uid(),name,start,cash:start,pos:{},trades:[],orders:[],dip:DIPD()});
const DEF={extra:[],sym:"PAXGUSDT",tf:"5m",type:"candle",sma:true,ema:false,vol:true,zoom:100,otype:"market",side:"buy",tab:"pos"};
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
S={...DEF,...S};
if(!S.accounts||!S.accounts.length){S.accounts=[mk("Konto 10.000",1e4),mk("Konto 1.000",1e3)];S.active=S.accounts[0].id}
S.accounts.forEach(a=>{a.orders=a.orders||[];a.dip={...DIPD(),...(a.dip||{})}});
S.extra.forEach(s=>{LIST.push([s,s.replace("USDT",""),"Eigene"]);NAME[s]=s.replace("USDT","")});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const acc=()=>S.accounts.find(a=>a.id===S.active)||S.accounts[0];
let candles=[],prices={},st24={},book={bids:[],asks:[]},mtr=[],mx=-1,my=-1;
const f=(n,d=2)=>Number(n).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const pr=n=>f(n,n<1?5:n<10?4:2),qf=n=>f(n,n<1?5:4);
const cls=n=>n>=0?"up":"dn";
const msg=t=>$("msg").textContent=t;

function equity(a){let e=a.cash;a.orders.forEach(o=>e+=o.lock||0);for(const s in a.pos)e+=a.pos[s].q*(prices[s]||a.pos[s].avg);return e}

function buildUI(){
  $("bar").innerHTML=Object.keys(TFS).map(k=>`<button data-t="${k}" class="${k===S.tf?"on":""}">${k}</button>`).join("")+
   `<span style="width:10px"></span>`+[["candle","Kerzen"],["line","Linie"]].map(([k,v])=>`<button data-y="${k}" class="${k===S.type?"on":""}">${v}</button>`).join("")+
   `<span style="width:10px"></span>`+[["sma","SMA 20"],["ema","EMA 50"],["vol","Volumen"]].map(([k,v])=>`<button data-i="${k}" class="${S[k]?"on":""}">${v}</button>`).join("");
  $("tabs").innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-b="${k}" class="${k===S.tab?"on":""}">${v}</button>`).join("");
  $("acc").innerHTML=S.accounts.map(a=>`<option value="${a.id}" ${a.id===S.active?"selected":""}>${a.name} · Start ${f(a.start,0)}</option>`).join("");
  document.querySelectorAll("#sd button").forEach(b=>{b.className=b.dataset.s===S.side?(S.side==="buy"?"buy":"sell"):""});
  $("go").className=S.side==="buy"?"buy":"sell";
  $("go").textContent=(S.side==="buy"?"Kaufen ":"Verkaufen ")+NAME[S.sym];
  $("ot").value=S.otype;
  $("pxin").disabled=S.otype==="market";
  $("pl").textContent=S.otype==="stop"?"Stop-Preis (USDT)":S.otype==="limit"?"Limit-Preis (USDT)":"Preis (Markt)";
  $("tps").style.display=S.side==="buy"?"flex":"none";
  $("dsym").innerHTML=LIST.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("");dipLoad();
}
$("bar").onclick=e=>{const d=e.target.dataset;
  if(d.t){S.tf=d.t;save();buildUI();load()}
  if(d.y){S.type=d.y;save();buildUI();draw()}
  if(d.i){S[d.i]=!S[d.i];save();buildUI();draw()}};
$("tabs").onclick=e=>{const k=e.target.dataset.b;if(k){S.tab=k;save();buildUI();renderBot()}};
$("sd").onclick=e=>{const k=e.target.dataset.s;if(k){S.side=k;save();buildUI();info()}};
$("ot").onchange=e=>{S.otype=e.target.value;save();buildUI();fillPx();info()};
$("acc").onchange=e=>{S.active=e.target.value;save();buildUI();render()};
$("q").oninput=renderIns;
$("new").onclick=()=>{const n=prompt("Name des Kontos:","Mein Konto");if(!n)return;
  const c=parseFloat(prompt("Startkapital in USDT:","5000"));if(!(c>0))return;
  const a=mk(n,c);S.accounts.push(a);S.active=a.id;save();buildUI();render()};
$("reset").onclick=()=>{if(confirm("Konto auf Startkapital zurücksetzen?")){const a=acc();a.cash=a.start;a.pos={};a.trades=[];a.orders=[];a.dip=DIPD();save();dipLoad();render()}};
$("del").onclick=()=>{if(S.accounts.length<2)return msg("Mindestens ein Konto muss bleiben.");
  if(confirm("Dieses Konto löschen?")){S.accounts=S.accounts.filter(a=>a.id!==S.active);S.active=S.accounts[0].id;save();buildUI();render()}};

function selectSym(s){S.sym=s;save();buildUI();$("pxin").value="";fillPx();book={bids:[],asks:[]};load()}
function addSym(x){if(LIST.some(l=>l[0]===x))return;LIST.push([x,x.replace("USDT",""),"Eigene"]);NAME[x]=x.replace("USDT","");S.extra.push(x);save()}
$("ins").onclick=e=>{const d=e.target.dataset,r=e.target.closest(".ir");
  if(d.r){LIST=LIST.filter(l=>l[0]!==d.r);S.extra=S.extra.filter(l=>l!==d.r);if(S.sym===d.r)S.sym="PAXGUSDT";save();buildUI();load();return}
  if(!r)return;
  if(r.dataset.a){addSym(r.dataset.a);$("q").value="";return selectSym(r.dataset.a)}
  selectSym(r.dataset.s)};
$("q").onkeydown=e=>{if(e.key==="Enter"){const r=$("ins").querySelector(".ir");if(r)r.click()}};
addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("q").focus()}});
function fillPx(){const p=prices[S.sym];if(p&&!$("pxin").value)$("pxin").value=p}
function px(){return S.otype==="market"?prices[S.sym]:parseFloat($("pxin").value)}
$("qty").oninput=()=>{const p=px();if(p)$("tot").value=+($("qty").value*p).toFixed(4);info()};
$("tot").oninput=()=>{const p=px();if(p)$("qty").value=+($("tot").value/p).toPrecision(6);info()};
$("pxin").oninput=()=>$("qty").oninput();
$("pc").onclick=e=>{const k=parseFloat(e.target.dataset.p);if(!k)return;const a=acc(),p=px();if(!p)return;
  if(S.side==="buy")$("qty").value=+(a.cash*k/(1+FEE)/p).toPrecision(6);
  else $("qty").value=+(((a.pos[S.sym]||{}).q||0)*k).toPrecision(6);
  $("qty").oninput()};
function info(){const a=acc(),p=px()||0,q=parseFloat($("qty").value)||0;
  $("av").textContent=S.side==="buy"?f(a.cash)+" USDT":qf((a.pos[S.sym]||{}).q||0)+" "+S.sym.replace("USDT","");
  $("fee").textContent=f(q*p*FEE,4)+" USDT"}

function exec(a,sym,side,q,p,type,lock){
  const pos=a.pos[sym]||{q:0,avg:0},t={t:Date.now(),sym,side,price:p,type};
  if(side==="buy"){
    const av=a.cash+lock;q=Math.min(q,av/(p*(1+FEE)));
    if(q<=1e-12){a.cash=av;return 0}
    const c=q*p,fe=c*FEE;a.cash=av-c-fe;
    pos.avg=(pos.avg*pos.q+c)/(pos.q+q);pos.q+=q;a.pos[sym]=pos;Object.assign(t,{q,fee:fe});
  }else{
    q=Math.min(q,pos.q);if(q<=1e-12)return 0;
    const g=q*p,fe=g*FEE;a.cash+=g-fe;t.pnl=(p-pos.avg)*q-fe;pos.q-=q;
    if(pos.q<1e-10)delete a.pos[sym];Object.assign(t,{q,fee:fe});
  }
  a.trades.push(t);return q;
}
function attach(a,sym,q,tp,sl){const oco=uid();
  if(tp>0)a.orders.push({id:uid(),sym,side:"sell",type:"limit",price:tp,q,lock:0,oco});
  if(sl>0)a.orders.push({id:uid(),sym,side:"sell",type:"stop",price:sl,q,lock:0,oco})}
function place(){
  const a=acc(),sym=S.sym,m=prices[sym];if(!m)return msg("Noch kein Kurs.");
  const q=parseFloat($("qty").value),p=px(),side=S.side,ty=S.otype;
  const tp=parseFloat($("tp").value)||0,sl=parseFloat($("sl").value)||0;
  if(!(q>0))return msg("Bitte Menge eingeben.");if(!(p>0))return msg("Bitte Preis eingeben.");
  if(side==="buy"&&q*p*(1+FEE)>a.cash+1e-9)return msg("Nicht genug Bargeld.");
  if(side==="sell"&&q>((a.pos[sym]||{}).q||0)+1e-12)return msg("Nicht genug Bestand.");
  if(ty==="market"){const r=exec(a,sym,side,q,m,"Markt",0);
    if(r&&side==="buy")attach(a,sym,r,tp,sl);msg((side==="buy"?"Gekauft":"Verkauft")+" zu "+pr(m))}
  else{const lock=side==="buy"?q*p*(1+FEE):0;a.cash-=lock;
    a.orders.push({id:uid(),sym,side,type:ty,price:p,q,tp,sl,lock});msg("Order platziert.")}
  save();checkOrders();render();
}
$("go").onclick=place;
async function uni(){try{
  UNI=(await(await fetch(SP+"ticker/price")).json()).map(x=>x.symbol);
  const ok=new Set(UNI);LIST=LIST.filter(x=>FUT.has(x[0])||ok.has(x[0]));
  if(!FUT.has(S.sym)&&!ok.has(S.sym))S.sym="PAXGUSDT";
  buildUI();render()}catch(e){}}
function setLive(o){$("live").className=o?"dot ok":"dot";$("live").lastChild.textContent=o?"Live":"Offline"}
function dipLoad(){const d=acc().dip;$("dsym").value=d.sym;$("dref").value=d.ref;$("ddrop").value=d.drop;$("damt").value=d.amt;$("dtp").value=d.tp;$("dsl").value=d.sl;$("dmax").value=d.max;$("dcd").value=d.cd;
  $("dtog").textContent=d.on?"Aktiv":"Aus";$("dtog").className=d.on?"on":""}
function dipRef(d){const h=(st24[d.sym]||{}).h;return d.ref==="h24"&&h?h:prices[d.sym]||0}
function dipRead(){const d=acc().dip,n=i=>parseFloat($(i).value)||0;
  d.sym=$("dsym").value;d.ref=$("dref").value;d.drop=Math.max(.1,n("ddrop"));d.amt=n("damt");d.tp=n("dtp");d.sl=n("dsl");d.max=Math.max(1,Math.round(n("dmax")));d.cd=n("dcd");
  if(d.on)d.peak=dipRef(d);save();dipLoad();renderDip();draw()}
["dsym","dref","ddrop","damt","dtp","dsl","dmax","dcd"].forEach(i=>$(i).onchange=dipRead);
$("dtog").onclick=()=>{const d=acc().dip;dipRead();d.on=!d.on;d.note="";
  if(d.on){if(!prices[d.sym]){d.on=false;d.note="Noch kein Kurs vorhanden."}else{d.peak=dipRef(d);d.buys=0;d.last=0}}
  save();dipLoad();renderDip();draw()};
function renderDip(){const d=acc().dip;let h;
  if(d.on){const t=d.peak*(1-d.drop/100),p=prices[d.sym]||0;
    h=`<div class="r"><span class="mut">Referenz-Hoch</span><span>${pr(d.peak)}</span></div><div class="r"><span class="mut">Kauf bei ≤</span><b class="up">${pr(t)}</b></div><div class="r"><span class="mut">Abstand zum Kauf</span><span>${f((p/t-1)*100)} %</span></div><div class="r"><span class="mut">Käufe</span><span>${d.buys} / ${d.max}</span></div>`}
  else h=`<div class="mut">${d.note||"Kauft automatisch, wenn der Kurs um den eingestellten Wert unter das Referenz-Hoch fällt. Läuft, solange diese Seite offen ist."}</div>`;
  $("dstat").innerHTML=h}
function dipRun(){S.accounts.forEach(a=>{const d=a.dip;if(!d.on)return;const p=prices[d.sym];if(!p)return;
  d.peak=Math.max(d.peak||p,p);
  if(p<=d.peak*(1-d.drop/100)&&d.buys<d.max&&Date.now()-d.last>=d.cd*6e4){
    const amt=Math.min(d.amt,a.cash/(1+FEE));
    if(amt<5){d.on=false;d.note="Gestoppt: nicht genug Bargeld.";return}
    const q=exec(a,d.sym,"buy",amt/p,p,"Dip-Bot",0);
    if(q){d.buys++;d.last=Date.now();d.peak=p;if(d.tp>0||d.sl>0)attach(a,d.sym,q,d.tp>0?p*(1+d.tp/100):0,d.sl>0?p*(1-d.sl/100):0)}
    if(d.buys>=d.max){d.on=false;d.note="Gestoppt: Maximum an Käufen erreicht."}
  }});save()}
function checkOrders(){
  S.accounts.forEach(a=>{a.orders.slice().forEach(o=>{
    const m=prices[o.sym];if(!m||!a.orders.includes(o))return;
    const hit=o.type==="limit"?(o.side==="buy"?m<=o.price:m>=o.price):(o.side==="buy"?m>=o.price:m<=o.price);
    if(!hit)return;
    a.orders=a.orders.filter(x=>x!==o&&!(o.oco&&x.oco===o.oco));
    const p=o.type==="limit"?(o.side==="buy"?Math.min(o.price,m):Math.max(o.price,m)):m;
    const r=exec(a,o.sym,o.side,o.q,p,o.type==="limit"?"Limit":"Stop",o.lock||0);
    if(r&&o.side==="buy")attach(a,o.sym,r,o.tp,o.sl);
  })});save();
}

async function load(){
  $("st").textContent="Lade Kurse …";
  try{
    const j=await(await fetch(`${B(S.sym)}klines?symbol=${S.sym}&interval=${etf()}&limit=200`)).json();
    candles=j.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));
    prices[S.sym]=candles[candles.length-1].c;fillPx();
  }catch(e){$("st").textContent="Keine Verbindung zu Binance. Seite online oder über einen lokalen Server öffnen.";}
  render();
}
async function tick(){
  try{
    const g=u=>fetch(u).then(r=>r.json()),fu=LIST.filter(x=>FUT.has(x[0])).map(x=>x[0]);
    const [t,d,...ft]=await Promise.all([
      g(SP+"ticker/24hr?symbols="+encodeURIComponent(JSON.stringify(LIST.filter(x=>!FUT.has(x[0])).map(x=>x[0])))),
      g(B(S.sym)+`depth?symbol=${S.sym}&limit=10`).catch(()=>({bids:[],asks:[]})),
      ...fu.map(x=>g(FP+"ticker/24hr?symbol="+x).catch(()=>null))]);
    [...t,...ft.filter(x=>x&&x.symbol)].forEach(x=>{prices[x.symbol]=+x.lastPrice;st24[x.symbol]={ch:+x.priceChangePercent,h:+x.highPrice,l:+x.lowPrice,v:+x.quoteVolume}});
    book={bids:(d.bids||[]).map(x=>[+x[0],+x[1]]),asks:(d.asks||[]).map(x=>[+x[0],+x[1]])};
    if(S.tab==="mt")mtr=await fetch(B(S.sym)+`trades?symbol=${S.sym}&limit=25`).then(r=>r.json());
    const c=candles[candles.length-1],p=prices[S.sym];
    if(c&&p){
      if(etf()==="1s"||Date.now()>=c.t+TFS[etf()]+500){await load();dipRun();checkOrders();return}
      c.c=p;c.h=Math.max(c.h,p);c.l=Math.min(c.l,p);
    }
    $("st").textContent="Live-Kurse von Binance · "+new Date().toLocaleTimeString("de-DE")+(FUT.has(S.sym)?" · Future-Kontrakt (Preis je Unze)"+(S.tf==="1s"?", 1s nicht verfügbar → 1m":""):"");
    dipRun();checkOrders();render();setLive(1);
  }catch(e){setLive(0)}
}

function render(){renderHead();renderDip();renderIns();renderBook();renderBot();info();draw()}
function renderHead(){
  const p=prices[S.sym],s=st24[S.sym]||{};
  $("hs").innerHTML=`<div><span>${NAME[S.sym]}</span><b style="font-size:16px">${p?pr(p):"–"}</b></div>`+
   (s.ch!==undefined?`<div><span>24h Änderung</span><b class="${cls(s.ch)}">${s.ch>=0?"+":""}${f(s.ch)} %</b></div><div><span>24h Hoch</span>${pr(s.h)}</div><div><span>24h Tief</span>${pr(s.l)}</div><div><span>24h Volumen</span>${f(s.v/1e6,1)} Mio USDT</div>`:"")+
   (()=>{const a=acc(),e=equity(a),d=e-a.start;return `<div><span>Kontowert</span><b>${f(e)} USDT</b></div><div><span>Gewinn / Verlust</span><b class="${cls(d)}">${d>=0?"+":""}${f(d)} (${f(d/a.start*100)} %)</b></div>`})();
}
function renderIns(){
  const q=$("q").value.trim().toLowerCase();let h="",g="";
  LIST.forEach(([s,n,gr])=>{if(q&&!(n+" "+s+" "+(AL[s]||"")).toLowerCase().includes(q))return;
    if(gr!==g){g=gr;h+=`<div class="gh">${gr}</div>`}
    const c=(st24[s]||{}).ch;
    h+=`<div class="ir ${s===S.sym?"on":""}" data-s="${s}"><span>${n}${gr==="Eigene"?` <b class="rm" data-r="${s}" title="Entfernen">×</b>`:""}</span><span>${prices[s]?pr(prices[s]):"–"} ${c!==undefined?`<span class="${cls(c)}">${f(c,1)}%</span>`:""}</span></div>`});
  if(q){const have=new Set(LIST.map(x=>x[0])),m=UNI.filter(x=>USD.test(x)&&!have.has(x)&&x.toLowerCase().includes(q)).slice(0,15);
    if(m.length)h+=`<div class="gh">Weitere Märkte (Binance)</div>`+m.map(x=>`<div class="ir" data-a="${x}"><span>${x.replace("USDT","")}</span><span class="mut">hinzufügen +</span></div>`).join("")}
  $("ins").innerHTML=h||'<div class="mut" style="padding:6px">Nichts gefunden.</div>';
}
function renderBook(){
  const mx2=Math.max(1e-9,...book.asks.map(x=>x[1]),...book.bids.map(x=>x[1]));
  const row=(x,c,bg)=>`<div class="bk" data-p="${x[0]}" style="background:linear-gradient(to left,${bg} ${x[1]/mx2*100}%,transparent 0)"><span class="${c}">${pr(x[0])}</span><span>${f(x[1],4)}</span></div>`;
  const sp=book.asks[0]&&book.bids[0]?book.asks[0][0]-book.bids[0][0]:0;
  $("book").innerHTML=book.asks.slice().reverse().map(x=>row(x,"dn","#e5534b33")).join("")+
   `<div class="mut" style="text-align:center;padding:3px">Spread ${pr(sp)}</div>`+book.bids.map(x=>row(x,"up","#26b57a33")).join("");
}
$("book").onclick=e=>{const r=e.target.closest(".bk");if(r&&S.otype!=="market"){$("pxin").value=r.dataset.p;$("qty").oninput()}};
function renderBot(){
  const a=acc();let h="";
  if(S.tab==="bal"){
    const e=equity(a);
    h="<tr><th>Asset</th><th>Anteil</th><th>Kurs</th><th>24h</th><th>Menge</th><th>Wert (USDT)</th></tr>"+
     `<tr><td>USDT (Bargeld${a.orders.some(o=>o.lock)?" + reserviert":""})</td><td>${f((a.cash+a.orders.reduce((s,o)=>s+(o.lock||0),0))/e*100,1)} %</td><td>1,00</td><td>–</td><td>${f(a.cash+a.orders.reduce((s,o)=>s+(o.lock||0),0))}</td><td>${f(a.cash+a.orders.reduce((s,o)=>s+(o.lock||0),0))}</td></tr>`+
     Object.entries(a.pos).map(([s,x])=>{const v=x.q*(prices[s]||x.avg),c=(st24[s]||{}).ch||0;
      return `<tr><td>${NAME[s]}</td><td>${f(v/e*100,1)} %</td><td>${pr(prices[s]||0)}</td><td class="${cls(c)}">${f(c)} %</td><td>${qf(x.q)}</td><td>${f(v)}</td></tr>`}).join("");
  }else if(S.tab==="pos"){
    h="<tr><th>Markt</th><th>Menge</th><th>Einstand</th><th>Kurs</th><th>Wert</th><th>G/V</th><th></th></tr>"+
     (Object.entries(a.pos).map(([s,x])=>{const c=prices[s]||x.avg,g=(c-x.avg)*x.q;
      return `<tr><td>${NAME[s]}</td><td>${qf(x.q)}</td><td>${pr(x.avg)}</td><td>${pr(c)}</td><td>${f(c*x.q)}</td><td class="${cls(g)}">${f(g)} (${f((c/x.avg-1)*100)} %)</td><td><button class="x" data-x="${s}">Schließen</button></td></tr>`}).join("")||'<tr><td colspan="7" class="mut">Keine offenen Positionen.</td></tr>');
  }else if(S.tab==="ord"){
    h="<tr><th>Markt</th><th>Art</th><th>Seite</th><th>Preis</th><th>Menge</th><th></th></tr>"+
     (a.orders.map(o=>`<tr><td>${NAME[o.sym]}</td><td>${o.type==="limit"?(o.oco&&o.side==="sell"?"Take Profit":"Limit"):(o.oco?"Stop Loss":"Stop")}</td><td class="${o.side==="buy"?"up":"dn"}">${o.side==="buy"?"Kauf":"Verkauf"}</td><td>${pr(o.price)}</td><td>${qf(o.q)}</td><td><button class="x" data-c="${o.id}">Abbrechen</button></td></tr>`).join("")||'<tr><td colspan="6" class="mut">Keine offenen Orders.</td></tr>');
  }else if(S.tab==="his"){
    h="<tr><th>Zeit</th><th>Markt</th><th>Art</th><th>Seite</th><th>Preis</th><th>Menge</th><th>Gebühr</th><th>Gewinn</th></tr>"+
     (a.trades.slice().reverse().map(t=>`<tr><td>${new Date(t.t).toLocaleString("de-DE")}</td><td>${NAME[t.sym]}</td><td>${t.type}</td><td class="${t.side==="buy"?"up":"dn"}">${t.side==="buy"?"Kauf":"Verkauf"}</td><td>${pr(t.price)}</td><td>${qf(t.q)}</td><td>${f(t.fee||0,4)}</td><td class="${cls(t.pnl||0)}">${t.pnl!==undefined?f(t.pnl):"–"}</td></tr>`).join("")||'<tr><td colspan="8" class="mut">Noch keine Trades.</td></tr>');
  }else if(S.tab==="stat"){
    const cl=a.trades.filter(t=>t.pnl!==undefined),w=cl.filter(t=>t.pnl>0),pnl=cl.reduce((x,t)=>x+t.pnl,0),fees=a.trades.reduce((x,t)=>x+(t.fee||0),0),eq=equity(a);
    h=[["Startkapital",f(a.start)+" USDT"],["Kontowert",f(eq)+" USDT"],["Gesamtrendite",`<span class="${cls(eq-a.start)}">${f((eq/a.start-1)*100)} %</span>`],["Realisierter Gewinn",`<span class="${cls(pnl)}">${f(pnl)} USDT</span>`],["Trades gesamt",a.trades.length],["Geschlossene Trades",cl.length],["Gewinnquote",cl.length?f(w.length/cl.length*100,1)+" %":"–"],["Bester Trade",cl.length?f(Math.max(...cl.map(t=>t.pnl)))+" USDT":"–"],["Schlechtester Trade",cl.length?f(Math.min(...cl.map(t=>t.pnl)))+" USDT":"–"],["Gebühren gesamt",f(fees)+" USDT"],["Käufe durch Dip-Bot",a.trades.filter(t=>t.type==="Dip-Bot").length]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
  }else{
    h="<tr><th>Zeit</th><th>Preis</th><th>Menge</th></tr>"+mtr.slice().reverse().map(t=>`<tr><td>${new Date(t.time).toLocaleTimeString("de-DE")}</td><td class="${t.isBuyerMaker?"dn":"up"}">${pr(+t.price)}</td><td>${f(+t.qty,5)}</td></tr>`).join("");
  }
  $("bot").innerHTML="<table>"+h+"</table>";
}
$("bot").onclick=e=>{const d=e.target.dataset,a=acc();
  if(d.c){const o=a.orders.find(x=>x.id===d.c);if(o){a.cash+=o.lock||0;a.orders=a.orders.filter(x=>x!==o);save();render()}}
  if(d.x){exec(a,d.x,"sell",a.pos[d.x].q,prices[d.x],"Markt",0);a.orders=a.orders.filter(o=>o.sym!==d.x||o.side==="buy");save();render()}};

const cv=$("cv"),ctx=cv.getContext("2d");
cv.onmousemove=e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;draw()};
cv.onmouseleave=()=>{mx=my=-1;draw()};
cv.addEventListener("wheel",e=>{e.preventDefault();S.zoom=Math.max(20,Math.min(200,S.zoom+(e.deltaY>0?10:-10)));save();draw()},{passive:false});
function ma(c,n,ema){const o=[];let s=0;
  c.forEach((x,i)=>{if(ema){o.push(i?o[i-1]+(x.c-o[i-1])*2/(n+1):x.c)}
    else{s+=x.c;if(i>=n)s-=c[i-n].c;o.push(i>=n-1?s/n:null)}});return o}
function draw(){
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(!candles.length)return;
  const all=candles,off=Math.max(0,all.length-S.zoom),v=all.slice(off),n=v.length;
  const L=6,R=72,T=22,B=22,cw=(W-L-R)/n,ph=H-T-B,vh=S.vol?ph*.18:0,pH=ph-vh;
  const a=acc(),tr=a.trades.filter(t=>t.sym===S.sym),od=a.orders.filter(o=>o.sym===S.sym),dp=a.dip,dt=dp.on&&dp.sym===S.sym?dp.peak*(1-dp.drop/100):0;
  let lo=Math.min(...v.map(c=>c.l)),hi=Math.max(...v.map(c=>c.h));
  const ps=[...tr.map(t=>t.price),...od.map(o=>o.price),...(dt?[dt]:[])].filter(p=>p>lo*.97&&p<hi*1.03);
  lo=Math.min(lo,...ps);hi=Math.max(hi,...ps);
  const pd=(hi-lo)*.08||1;lo-=pd;hi+=pd;
  const Y=p=>T+(hi-p)/(hi-lo)*pH,X=i=>L+cw*(i+.5);
  ctx.font="11px sans-serif";ctx.textBaseline="middle";
  for(let i=0;i<=5;i++){const p=lo+(hi-lo)*i/5,y=Y(p);
    ctx.strokeStyle="#222d3b";ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();
    ctx.fillStyle="#7f8d9e";ctx.textAlign="left";ctx.fillText(pr(p),W-R+6,y)}
  ctx.textAlign="center";ctx.textBaseline="top";
  const stp=Math.ceil(n/7),fmt=t=>{const d=new Date(t);return TFS[etf()]>=864e5?d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}):d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",...(etf()==="1s"?{second:"2-digit"}:{})})};
  for(let i=0;i<n;i+=stp){ctx.fillStyle="#7f8d9e";ctx.fillText(fmt(v[i].t),X(i),H-B+6)}
  if(S.vol){const mv=Math.max(...v.map(c=>c.v))||1;
    v.forEach((c,i)=>{ctx.fillStyle=c.c>=c.o?"#26b57a55":"#e5534b55";const h=c.v/mv*vh;ctx.fillRect(X(i)-cw*.35,H-B-h,cw*.7,h)})}
  if(S.type==="line"){ctx.strokeStyle="#d9a93a";ctx.lineWidth=2;ctx.beginPath();
    v.forEach((c,i)=>i?ctx.lineTo(X(i),Y(c.c)):ctx.moveTo(X(i),Y(c.c)));ctx.stroke();ctx.lineWidth=1}
  else v.forEach((c,i)=>{const col=c.c>=c.o?"#26b57a":"#e5534b",x=X(i);ctx.strokeStyle=ctx.fillStyle=col;
    ctx.beginPath();ctx.moveTo(x,Y(c.h));ctx.lineTo(x,Y(c.l));ctx.stroke();
    const y1=Y(Math.max(c.o,c.c)),y2=Y(Math.min(c.o,c.c));ctx.fillRect(x-cw*.35,y1,cw*.7,Math.max(1,y2-y1))});
  [["sma",ma(all,20,0),"#5aa9e6"],["ema",ma(all,50,1),"#c77dff"]].forEach(([k,arr,col])=>{if(!S[k])return;
    ctx.strokeStyle=col;ctx.beginPath();let st=false;
    arr.slice(off).forEach((p,i)=>{if(p==null)return;st?ctx.lineTo(X(i),Y(p)):ctx.moveTo(X(i),Y(p));st=true});ctx.stroke()});
  const lc=v[n-1],ly=Y(lc.c);
  ctx.setLineDash([4,4]);ctx.strokeStyle="#7f8d9e";ctx.beginPath();ctx.moveTo(L,ly);ctx.lineTo(W-R,ly);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="#d9a93a";ctx.fillRect(W-R,ly-9,R,18);ctx.fillStyle="#0e131a";ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(pr(lc.c),W-R+6,ly);
  const pos=a.pos[S.sym];
  if(pos){const y=Y(pos.avg);ctx.setLineDash([2,3]);ctx.strokeStyle="#5aa9e6";ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle="#5aa9e6";ctx.fillText("Einstand "+pr(pos.avg),L+4,y-8)}
  od.forEach(o=>{const y=Y(o.price),c=o.side==="buy"?"#26b57a":"#e5534b";
    ctx.setLineDash([6,3]);ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=c;ctx.textAlign="left";ctx.fillText((o.oco?(o.type==="limit"?"TP":"SL"):o.type==="limit"?"Limit":"Stop")+" "+(o.side==="buy"?"Kauf ":"Verkauf ")+qf(o.q),L+4,y-8)});
  if(dt){const y=Y(dt);ctx.setLineDash([8,4]);ctx.strokeStyle="#f0883e";ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle="#f0883e";ctx.textAlign="left";ctx.fillText("Dip-Kauf "+pr(dt),L+4,y-8)}
  tr.forEach(t=>{const i=v.findIndex(c=>t.t>=c.t&&t.t<c.t+TFS[etf()]);if(i<0)return;
    const x=X(i),y=Y(t.price),b=t.side==="buy",s=8;
    ctx.fillStyle=b?"#26b57a":"#e5534b";ctx.strokeStyle="#fff";ctx.beginPath();
    if(b){ctx.moveTo(x,y+2);ctx.lineTo(x-s,y+2+s*1.6);ctx.lineTo(x+s,y+2+s*1.6)}else{ctx.moveTo(x,y-2);ctx.lineTo(x-s,y-2-s*1.6);ctx.lineTo(x+s,y-2-s*1.6)}
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText(b?"Kauf":"Verkauf",x,b?y+2+s*1.6+9:y-2-s*1.6-9)});
  let hc=lc;
  if(mx>L&&mx<W-R&&my>T&&my<H-B){
    const i=Math.min(n-1,Math.max(0,Math.floor((mx-L)/cw)));hc=v[i];
    ctx.strokeStyle="#7f8d9e";ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(L,my);ctx.lineTo(W-R,my);ctx.moveTo(X(i),T);ctx.lineTo(X(i),H-B);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle="#2a3647";ctx.fillRect(W-R,my-9,R,18);ctx.fillStyle="#e6ebf1";ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(pr(hi-(my-T)/pH*(hi-lo)),W-R+6,my);
    const lb=fmt(hc.t),tw=ctx.measureText(lb).width+12;ctx.fillStyle="#2a3647";ctx.fillRect(X(i)-tw/2,H-B+2,tw,16);ctx.fillStyle="#e6ebf1";ctx.textAlign="center";ctx.fillText(lb,X(i),H-B+10);
  }
  ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillStyle="#7f8d9e";
  ctx.fillText(`${NAME[S.sym]} · ${S.tf}   O ${pr(hc.o)}  H ${pr(hc.h)}  L ${pr(hc.l)}  C ${pr(hc.c)}  Vol ${f(hc.v,2)}`,L+2,10);
}
addEventListener("resize",draw);
buildUI();uni().then(load);setInterval(tick,2000);
</script>
